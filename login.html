<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="css/auth.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="auth-container">
    <h2><span style="color:#1f57ff;">Finance</span>Tracker</h2>
    <p>Sign in to manage your finances</p>

    <form id="loginForm">
      <label for="email">Username</label>
      <div class="input-group">
        <span class="icon"><i class="fa-regular fa-user"></i></span>
        <input type="email" id="email" placeholder="Enter your username" required />
      </div>

      <label for="password">Password</label>
      <div class="input-group">
        <span class="icon"><i class="fa-solid fa-lock"></i></span>
        <input type="password" id="password" placeholder="Enter your password" required />
      </div>

      <div class="forgot">
        <a href="#">Forgot your password?</a>
      </div>

      <button type="submit">→ Sign In</button>
    </form>

    <p class="register-text">Don’t have an account? <a href="register.html">Create one now</a></p>

    <button id="guestBtn" class="guest-btn">Continue as Guest</button>

    <footer>
      © 2025 Warith Lawal. All rights reserved.
    </footer>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="auth/login.js"></script>

  <!-- ✅ Toast Notification -->
  <div id="toast" class="toast"></div>
</body>
</html>
