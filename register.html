<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>
  <link rel="stylesheet" href="css/auth.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- ✅ Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="auth-container">
    <h2><span style="color:#1f57ff;">Finance</span>Tracker</h2>
    <p>Create an account to get started</p>

    <form id="registerForm">
      <!-- Username -->
      <label for="name">Username</label>
      <div class="input-group">
        <span class="icon"><i class="fa-regular fa-user"></i></span>
        <input type="text" id="name" placeholder="Choose a username" required />
      </div>

      <!-- Email -->
      <label for="email">Email</label>
      <div class="input-group">
        <span class="icon"><i class="fa-regular fa-envelope"></i></span>
        <input type="email" id="email" placeholder="Enter your email" required />
      </div>

      <!-- Password -->
      <label for="password">Password</label>
      <div class="input-group">
        <span class="icon"><i class="fa-solid fa-lock"></i></span>
        <input type="password" id="password" placeholder="Create a password" required />
        <span class="toggle-icon"></span>
      </div>
      <p class="hint">Don't Forget it</p>

      <!-- Create Account Button -->
      <button type="submit">→ Create Account</button>
    </form>

    <!-- Footer Text -->
    <p class="register-text">Already have an account? <a href="login.html">Sign in</a></p>

    <footer>
      © 2025 Warith Lawal. All rights reserved.
    </footer>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="auth/register.js"></script>

  <!-- ✅ Toast Notification -->
  <div id="toast" class="toast"></div>
</body>
</html>
